<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com html5</title>
</head>
<body>

    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado localmente no meu próprio servidor</p>

    <video width="500" poster="imagens/Spcity.webp"  controls autoplay loop>
<source src="midia/Meu-Videomkv.mkv" type="video/mkv">
<source src="midia/meu-video1mp4.mp4" type="video/mp4">
<p>Seu navegador não tem compatibilidade com reprodução de videos.

</p>
</video>
<h1>Inserindo videos direto do YouTube</h1>
<p>Este video esta hospedado no YouTube, e estou usando a tag iframe para exibir ele aqui</p>
<iframe width="560" height="315" src="https://www.youtube.com/embed/L2PO0wngHKo?si=NrHoSjH6VeA5Bpd4" 
referrerpolicy="strict-origin-when-cross-origin"title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"  allowfullscreen></iframe>
</body>
</html>
