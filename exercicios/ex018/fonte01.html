<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes com Google Fonts</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Kaushan+Script&display=swap');
    body{
        font-family: 'Kaushan Script', cursive;
        font-size: 2em;
    }
    h1{
        font-family: 'Fredericka the Great', cursive;
        font-weight: normal;
    }
</style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Beatae eius totam quaerat excepturi, provident tenetur asperiores molestias esse debitis fugiat voluptates deserunt cumque. Provident, vitae? Impedit maiores laboriosam repellendus excepturi!</p>
    
</body>
</html>
