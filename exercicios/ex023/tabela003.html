<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
body {
    font-family: Arial, Helvetica, sans-serif;
 }
table {
    border-collapse: collapse;
    width: 500px;
    text-align: center;
}
td {
    border: 1px solid black;
    padding: 10px;
}
    </style>
    <!-- Para mesclar células, usamos os atributos colspan e rowspan. O atributo colspan é usado para mesclar células horizontalmente, enquanto o atributo rowspan é usado para mesclar células verticalmente. Por exemplo, se quisermos mesclar duas células na mesma linha, podemos usar o atributo colspan="2" na célula que queremos mesclar. Da mesma forma, se quisermos mesclar duas células na mesma coluna, podemos usar o atributo rowspan="2" na célula que queremos mesclar.
      
    -->

 
</head>
<body>
    <h1>Mesclagem de celulas</h1>
    <table>
<tr>
    <td>A</td>
    <td colspan="2">B</td>
    
</tr>

<tr>
    <td rowspan="3">D</td>
    <td>E</td>
    <td rowspan="2">F</td>
</tr>
<tr>
   
    <td>H</td>
    
</tr>

<tr>
    
    <td colspan="2">M</td>
</tr>


    </table>
</body>
</html>
